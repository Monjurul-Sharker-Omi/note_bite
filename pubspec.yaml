name: note_bite
description: "A retro Japanese minimalist study app for students."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  http: ^1.6.0
  dio: ^5.9.2
  google_fonts: ^8.1.0
  intl: ^0.20.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  go_router: ^17.3.0
  flutter_dotenv: ^5.1.0
  path_provider: ^2.1.6
  file_picker: ^8.0.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
